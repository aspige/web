<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      padding: 40px;
      color: #222;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    #contenido {
      display: none;
    }

    a {
      display: block;
      margin: 12px 0;
      color: #0066cc;
      font-weight: bold;
    }
  </style>

  <script>
    function comprobarClave() {
      var clave = prompt("Introduce la contraseña:");

      if (clave === "ASPIGE.UTILIDADES_2026") {
        document.getElementById("contenido").style.display = "block";
      } else {
        alert("Contraseña incorrecta");
        window.location.href = "/";
      }
    }
  </script>
</head>

<body onload="comprobarClave()">
  <div id="contenido" class="box">

  </div>
</body>
</html>
